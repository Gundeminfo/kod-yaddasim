name: Qiymətləri topla
# Every morning the robot reads the shops' websites and saves today's prices and the changes
# into data/. The commit also keeps the repository active, so GitHub keeps the schedule on.
on:
  schedule:
    - cron: '17 3 * * *'   # 07:17 Bakı vaxtı
  workflow_dispatch:
    inputs:
      only:
        description: 'Yalnız bu mağazalar (məs. araz,bazar). Boş = hamısı'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: prices
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Mağazaları oxu
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then node robot.mjs --only "$ONLY"; else node robot.mjs; fi
      - name: Yadda saxla
        run: |
          git config user.name "qiymet-robotu"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Qiymətlər $(TZ=Asia/Baku date +%F)" || echo "dəyişiklik yoxdur"
          git pull --rebase --autostash || true
          git push
