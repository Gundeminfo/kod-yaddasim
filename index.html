<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Məhsul Bazası</title>
<meta name="theme-color" content="#B0173B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Məhsul Bazası">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FBF7F5; --surface:#FFFFFF; --ink:#2B1B20; --muted:#7D6A70; --line:#EDE3E0;
  --accent:#B0173B; --accent-ink:#FFFFFF; --accent-soft:#F9E2E7;
  --tag:#FFD54A; --tag-ink:#3B2A00; --danger:#B42318;
  --font:'Archivo', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --pad:18px;
}
[data-theme="yarpaq"]{--accent:#2F6B3F; --accent-soft:#DCEEDF}
[data-theme="deniz"]{--accent:#1E5A8C; --accent-soft:#DBE8F4}
[data-theme="gece"]{--paper:#1F191C; --surface:#2A2327; --ink:#F4ECEA; --muted:#B4A3A8; --line:#3B3135; --accent:#FF6382; --accent-ink:#2A0912; --accent-soft:#48262F; --tag:#F5C93A}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;
  -webkit-tap-highlight-color:transparent;min-height:100vh}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
img{display:block;max-width:100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{max-width:760px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 14px) calc(env(safe-area-inset-right) + var(--pad)) calc(env(safe-area-inset-bottom) + 40px) calc(env(safe-area-inset-left) + var(--pad))}

/* ---------- hero ---------- */
.hero-top{display:flex;align-items:center;justify-content:space-between;min-height:44px}
.hello{margin:0;font-size:15px;color:var(--muted)}
.hello b{color:var(--ink);font-weight:650}
.title{margin:6px 0 4px;font-size:clamp(42px,13vw,64px);line-height:.9;font-weight:850;font-stretch:125%;letter-spacing:-.015em;color:var(--accent);overflow-wrap:anywhere}
.meta{margin:8px 0 0;font-size:14px;color:var(--muted)}
.note{margin:12px 0 0;padding:10px 12px;border-radius:12px;background:var(--accent-soft);font-size:14px}

.icon-btn{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.icon-btn svg{width:22px;height:22px}

/* ---------- search ---------- */
.searchbar{display:flex;gap:8px;margin:18px 0 18px;position:sticky;top:0;z-index:5;padding:8px 0;background:var(--paper)}
.search{flex:1;min-width:0;display:flex;align-items:center;gap:8px;height:52px;padding:0 14px;border-radius:16px;background:var(--surface);border:1.5px solid var(--line)}
.search:focus-within{border-color:var(--accent)}
.search svg{width:20px;height:20px;color:var(--muted);flex:none}
.search input{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;height:100%}
.search input::-webkit-search-cancel-button{display:none}
.clear-q{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:50%;display:none;place-items:center;padding:0}
.clear-q.show{display:grid}
.clear-q svg{width:18px;height:18px}
.scan-btn{flex:none;height:52px;padding:0 16px 0 14px;border:0;border-radius:16px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.scan-btn svg{width:24px;height:24px}

/* ---------- category tiles ---------- */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{position:relative;display:flex;flex-direction:column;justify-content:space-between;min-height:118px;padding:14px;border-radius:22px;background:var(--t);color:#2B1B20;text-decoration:none;border:0;text-align:left}
[data-theme="gece"] .tile{background:color-mix(in srgb,var(--t) 22%,var(--surface));color:var(--ink)}
.tile:active{transform:scale(.98)}
.tile-emoji{font-size:34px;line-height:1}
.tile-name{font-weight:700;font-size:16px;line-height:1.15;padding-right:6px}
.tile-count{position:absolute;top:14px;right:14px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;opacity:.7}
.tile.wide{grid-column:1/-1;min-height:88px}

/* ---------- category head ---------- */
.cat-head{display:flex;align-items:center;gap:12px}
.cat-head h1{margin:0;flex:1;min-width:0;font-size:26px;line-height:1.05;font-weight:800;font-stretch:112%;overflow-wrap:anywhere}
.cat-badge{font-size:30px;line-height:1;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--t);flex:none}
.add-btn{flex:none;height:44px;padding:0 14px 0 10px;border-radius:14px;border:1.5px solid var(--accent);background:transparent;color:var(--accent);font-weight:700;display:flex;align-items:center;gap:4px}
.add-btn svg{width:20px;height:20px}

/* ---------- product cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card{display:flex;flex-direction:column;align-items:flex-start;gap:6px;padding:8px 8px 12px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:left;min-width:0}
.card:active{transform:scale(.985)}
.ph{width:100%;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--t,#EEE);display:grid;place-items:center;font-size:44px}
[data-theme="gece"] .ph{background:color-mix(in srgb,var(--t,#888) 22%,var(--surface))}
.ph img{width:100%;height:100%;object-fit:cover}
.nm{font-size:14px;font-weight:600;line-height:1.25;padding:2px 4px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.card .tag{margin-left:4px}
.code{padding:0 4px;font-size:23px;line-height:1;font-weight:780;font-stretch:125%;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.code.none{font-size:14px;font-weight:500;font-stretch:100%;color:var(--muted)}
.cat-chip{padding:0 4px;font-size:12px;color:var(--muted)}

/* price tag: a little shelf label with a punched hole */
.tag{position:relative;display:inline-flex;align-items:baseline;gap:4px;background:var(--tag);color:var(--tag-ink);
  padding:4px 10px 4px 20px;font-weight:750;font-size:14px;line-height:1.2;font-variant-numeric:tabular-nums;
  clip-path:polygon(9px 0,100% 0,100% 100%,9px 100%,0 50%);border-radius:0 8px 8px 0}
.tag::before{content:"";position:absolute;left:8px;top:50%;width:6px;height:6px;margin-top:-3px;border-radius:50%;background:var(--surface)}
.tag small{font-weight:600;font-size:.8em;opacity:.8}
.tag.empty{background:var(--line);color:var(--muted);font-weight:600}

/* ---------- empty / status ---------- */
.empty-state{padding:28px 18px;border-radius:22px;border:1.5px dashed var(--line);text-align:center;color:var(--muted)}
.empty-state p{margin:0 0 14px}
.btn{height:48px;padding:0 18px;border-radius:14px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn svg{width:20px;height:20px}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--line)}
.btn.danger{background:transparent;color:var(--danger);border:1.5px solid color-mix(in srgb,var(--danger) 35%,transparent)}
.btn.wide{width:100%}
.btn:disabled{opacity:.55}
.loading{padding:40px 0;text-align:center;color:var(--muted)}

/* ---------- overlays ---------- */
.overlay{position:fixed;inset:0;z-index:50}
.scrim{position:absolute;inset:0;background:rgba(20,10,14,.45);opacity:0;transition:opacity .2s}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94vh;max-width:640px;margin:0 auto;overflow:auto;overscroll-behavior:contain;
  background:var(--paper);border-radius:26px 26px 0 0;padding:10px var(--pad) calc(env(safe-area-inset-bottom) + 22px);transform:translateY(100%);transition:transform .24s cubic-bezier(.2,.8,.2,1)}
.overlay.open .scrim{opacity:1}
.overlay.open .sheet{transform:none}
.sheet-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:-10px;margin:-10px calc(-1 * var(--pad)) 6px;padding:10px var(--pad) 8px;background:var(--paper);z-index:2}
.sheet-bar h2{margin:0;font-size:20px;font-weight:800;font-stretch:112%}
.grab{position:absolute;top:4px;left:50%;width:40px;height:4px;margin-left:-20px;border-radius:2px;background:var(--line)}

/* detail */
.det-photo{border-radius:20px;overflow:hidden;aspect-ratio:1;background:var(--t,#EEE);display:grid;place-items:center;font-size:90px;max-height:52vh;margin:0 auto}
.det-photo img{width:100%;height:100%;object-fit:cover}
.det-cat{margin:14px 0 2px;color:var(--muted);font-size:14px}
.det-name{margin:0 0 12px;font-size:24px;line-height:1.15;font-weight:800;overflow-wrap:anywhere}
.det-price .tag{font-size:20px;padding:6px 14px 6px 26px;clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%)}
.det-price .tag::before{left:11px;width:8px;height:8px;margin-top:-4px}
.det-code{margin:16px 0 4px;padding:14px 16px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;gap:12px}
.det-code .lbl{font-size:13px;color:var(--muted)}
.det-code .num{display:block;font-size:clamp(34px,11vw,52px);line-height:1;font-weight:800;font-stretch:125%;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.det-code > div{flex:1;min-width:0}
.det-bar{margin:8px 0 0;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.det-bar b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
.linkish{border:0;background:transparent;color:var(--accent);font-weight:700;padding:6px 0}
.det-actions{display:flex;gap:10px;margin-top:20px}
.det-actions .btn{flex:1}

/* form */
.form{display:flex;flex-direction:column;gap:14px}
.photo-pick{display:grid;grid-template-columns:120px 1fr;gap:12px;align-items:stretch}
.photo-box{aspect-ratio:1;border-radius:18px;border:1.5px dashed var(--line);background:var(--surface);display:grid;place-items:center;overflow:hidden;color:var(--muted);padding:0}
.photo-box img{width:100%;height:100%;object-fit:cover}
.photo-box svg{width:34px;height:34px}
.photo-btns{display:flex;flex-direction:column;gap:8px;justify-content:center}
.field label{display:block;font-size:14px;font-weight:600;margin:0 0 6px}
.field .hint{font-size:13px;color:var(--muted);margin:6px 0 0}
.field .warn{font-size:13px;color:var(--danger);margin:6px 0 0}
.inp{width:100%;height:50px;padding:0 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);font-size:16px;outline:0}
.inp:focus{border-color:var(--accent)}
.row{display:flex;gap:8px}
.row .inp{flex:1;min-width:0}
.seg{display:flex;border:1.5px solid var(--line);border-radius:14px;overflow:hidden;flex:none;background:var(--surface)}
.seg button{border:0;background:transparent;padding:0 14px;height:47px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sq-btn{flex:none;width:50px;height:50px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);display:grid;place-items:center}
.sq-btn svg{width:24px;height:24px}
.form-actions{display:flex;gap:10px;margin-top:6px}
.form-actions .btn{flex:1}

/* picker */
.pick-list{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.pick{display:flex;align-items:center;gap:12px;padding:8px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left}
.pick .ph{width:52px;flex:none;font-size:24px;border-radius:10px}
.pick .tx{flex:1;min-width:0}
.pick .tx b{display:block;font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pick .tx span{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}

/* photo search */
.rec-head{display:flex;gap:12px;align-items:center;margin-bottom:14px}
.rec-q{width:76px;height:76px;border-radius:16px;overflow:hidden;flex:none;background:var(--line)}
.rec-q img{width:100%;height:100%;object-fit:cover}
.rec-status{margin:0;font-size:15px;color:var(--muted)}
.rec-status b{color:var(--ink)}
.best{display:grid;grid-template-columns:116px 1fr;gap:14px;align-items:center;width:100%;padding:10px;border-radius:22px;background:var(--surface);border:2px solid var(--accent);text-align:left}
.best .ph{border-radius:14px;font-size:40px}
.best .info{display:flex;flex-direction:column;gap:8px;min-width:0;align-items:flex-start}
.best .nm{padding:0;font-size:16px}
.best .code{padding:0;font-size:30px}
.badge{display:inline-block;font-size:13px;font-weight:700;color:var(--accent-ink);background:var(--accent);padding:3px 10px;border-radius:999px}
.badge.soft{background:var(--accent-soft);color:var(--ink)}
.rec-sub{margin:18px 0 8px;font-size:15px;font-weight:700}
.rec-none{padding:16px;border-radius:18px;border:1.5px dashed var(--line);color:var(--muted);margin:0}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
.rec-actions{display:flex;gap:10px;margin-top:18px}
.rec-actions .btn{flex:1}

/* settings */
.set-sec{margin:18px 0 0}
.set-sec h3{margin:0 0 10px;font-size:16px;font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:42px;padding:0 14px 0 8px;border-radius:21px;border:1.5px solid var(--line);background:var(--surface);display:flex;align-items:center;gap:8px;font-weight:600}
.chip i{width:26px;height:26px;border-radius:50%;background:var(--c)}
.chip[aria-pressed="true"]{border-color:var(--ink)}
.cat-rows{display:flex;flex-direction:column;gap:8px}
.cat-row{display:flex;gap:8px;align-items:center}
.cat-row .emo{width:52px;flex:none;text-align:center;font-size:22px;padding:0}
.cat-row .inp{flex:1;min-width:0}
.cat-row .sq-btn{color:var(--danger)}
.store-state{font-size:14px;color:var(--muted);margin:0 0 10px}
.stack{display:flex;flex-direction:column;gap:8px}
textarea.inp{height:110px;padding:10px 14px;resize:vertical;font-size:13px}

/* confirm */
.dialog{position:absolute;left:50%;top:50%;width:min(88vw,380px);transform:translate(-50%,-46%) scale(.98);opacity:0;transition:.18s;background:var(--paper);border-radius:22px;padding:20px}
.overlay.open .dialog{transform:translate(-50%,-50%);opacity:1}
.dialog p{margin:0 0 18px;font-size:17px;line-height:1.35}
.dialog .row .btn{flex:1}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 22px);transform:translate(-50%,20px);opacity:0;z-index:90;
  background:var(--ink);color:var(--paper);padding:12px 18px;border-radius:14px;font-weight:600;font-size:15px;max-width:88vw;transition:.2s;pointer-events:none}
#toast.show{opacity:1;transform:translate(-50%,0)}

@media (min-width:600px){
  .tiles{grid-template-columns:repeat(3,1fr)}
  .tile.wide{grid-column:auto;min-height:118px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition:none!important;animation:none!important}
}

/* gate screens: loading / sign-in / no access */
.gate{min-height:80vh;display:flex;flex-direction:column;justify-content:center;gap:14px}
.gate .title{margin-bottom:6px}
.gate p{margin:0;color:var(--muted);max-width:34ch}
.gate .btn{margin-top:10px}
.gate .note{color:var(--ink)}
.g-logo{width:20px;height:20px;background:#fff;border-radius:50%;display:grid;place-items:center}

/* live scanner */
.scan-ov{background:#0E0A0C;color:#fff;display:flex;flex-direction:column;opacity:0;transition:opacity .2s}
.scan-ov.open{opacity:1}
.scan-top{display:flex;align-items:center;gap:12px;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
.scan-top p{margin:0;font-weight:700;font-size:17px;flex:1}
.ai-chip{font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:rgba(255,255,255,.14);white-space:nowrap}
.ai-chip.ok{background:#2F6B3F}
.icon-btn.light{background:rgba(255,255,255,.12);border-color:transparent;color:#fff}
.scan-stage{position:relative;flex:1;min-height:180px;overflow:hidden;display:grid;place-items:center}
.scan-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.scan-stage.live video{display:block}
.scan-frame{position:relative;width:min(70vw,300px);aspect-ratio:1;border-radius:22px;box-shadow:0 0 0 2000px rgba(0,0,0,.42);display:none}
.scan-stage.live .scan-frame{display:block}
.scan-frame::before{content:"";position:absolute;inset:0;border-radius:22px;border:3px solid #fff;
  -webkit-mask:linear-gradient(#000 0 0) top left/30px 30px no-repeat,linear-gradient(#000 0 0) top right/30px 30px no-repeat,linear-gradient(#000 0 0) bottom left/30px 30px no-repeat,linear-gradient(#000 0 0) bottom right/30px 30px no-repeat;
          mask:linear-gradient(#000 0 0) top left/30px 30px no-repeat,linear-gradient(#000 0 0) top right/30px 30px no-repeat,linear-gradient(#000 0 0) bottom left/30px 30px no-repeat,linear-gradient(#000 0 0) bottom right/30px 30px no-repeat}
.scan-frame.hit::before{border-color:var(--tag)}
.scan-msg{position:relative;max-width:320px;padding:0 24px;text-align:center;color:rgba(255,255,255,.88)}
.scan-msg svg{width:52px;height:52px;margin:0 auto 12px;display:block;opacity:.9}
.scan-stage.live .scan-msg{display:none}
.scan-panel{background:var(--paper);color:var(--ink);border-radius:24px 24px 0 0;padding:14px 14px calc(env(safe-area-inset-bottom) + 14px);display:flex;flex-direction:column;gap:10px}
.scan-panel .row .btn{flex:1}
.live-hint{margin:0;padding:14px;border-radius:18px;border:1.5px dashed var(--line);color:var(--muted);text-align:center;font-size:15px}
.live-alt{display:flex;gap:8px;overflow-x:auto}
.live-alt button{flex:none;max-width:48%;height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pct{font-size:12px;color:var(--muted);font-weight:600}
.acct{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.acct span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}

/* sign-in with password, members list */
.gate .or{margin:2px 0;max-width:none;text-align:center;color:var(--muted);font-size:14px}
.login-form{display:flex;flex-direction:column;gap:8px}
.mem-add{display:flex;flex-direction:column;gap:8px;margin-bottom:10px}
.mem-add .row .inp{flex:1}
.mem-list{display:flex;flex-direction:column;gap:8px}
.mem-row{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 12px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.mem-row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.mem-row select.inp{width:auto;height:40px;padding:0 8px;font-size:14px}
.mem-row .sq-btn{width:40px;height:40px;color:var(--danger)}
.acct small{color:var(--muted);font-size:12px}
.det-by{margin:12px 0 0;font-size:13px;color:var(--muted);overflow-wrap:anywhere}

/* ---------- shop prices ---------- */
:root{--sale:#D3202B}
[data-theme="gece"]{--sale:#FF6B6B}
.tag.sale{background:var(--sale);color:#fff}
.tag.sale s{font-weight:600;font-size:.78em;opacity:.8;margin-left:2px}
.ph{position:relative}
.off{position:absolute;top:6px;left:6px;padding:2px 7px;border-radius:999px;background:var(--sale);color:#fff;font-size:12px;font-weight:750;line-height:1.3;font-variant-numeric:tabular-nums}
.det-code .num.sku{font-size:clamp(26px,8vw,38px)}

.det-prices{margin:16px 0 0}
.pt-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.pt-head h3{margin:0;font-size:16px;font-weight:800}
.link-btn{border:0;background:transparent;color:var(--accent);font-weight:700;font-size:15px;padding:6px 2px;min-height:40px}
.pt{width:100%;table-layout:fixed;border-collapse:separate;border-spacing:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden;font-variant-numeric:tabular-nums}
.pt th,.pt td{padding:10px 12px;border-top:1px solid var(--line);font-size:15px;vertical-align:top;text-align:right;white-space:nowrap}
.pt thead th{border-top:0;padding-top:8px;padding-bottom:8px;font-size:12px;font-weight:600;color:var(--muted)}
.pt th:first-child{text-align:left;white-space:normal;width:40%}
.pt th,.pt td{overflow-wrap:anywhere}
.pt tbody th{font-weight:700}
.pt tbody th small{display:block;margin-top:2px;font-size:12px;font-weight:500;color:var(--muted)}
.pt .cheap{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:999px;background:#2F6B3F;color:#fff;font-size:11px;font-weight:700;vertical-align:1px}
.pt tr.cheapest th,.pt tr.cheapest td{background:color-mix(in srgb,#2F6B3F 9%,var(--surface))}
.pt td b{color:var(--sale);font-weight:750}
.pct-off{display:block;margin-top:2px;font-size:12px;font-weight:700;color:var(--sale)}
.pt .none{color:var(--muted)}
.pt-unit{margin:6px 2px 0;font-size:12px;color:var(--muted)}

/* price inputs in the form */
.lbl-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 8px}
.flabel{font-size:14px;font-weight:600}
.lbl-row .seg button{height:38px}
.pgrid{display:grid;grid-template-columns:minmax(64px,auto) 1fr 1fr 42px;gap:6px;align-items:center}
.pg-h{padding-left:4px;font-size:12px;font-weight:600;color:var(--muted)}
.field .pg-store{display:block;margin:0;font-size:14px;font-weight:600;overflow-wrap:anywhere}
.pgrid .inp{height:44px;padding:0 10px;font-variant-numeric:tabular-nums;min-width:0}
.pg-pct{font-size:13px;font-weight:700;color:var(--sale);text-align:right;font-variant-numeric:tabular-nums}

/* sub-category filter rows */
#filters{margin:-8px 0 14px}
#filters:empty{display:none}
.frow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0;margin:0 calc(-1 * var(--pad));padding-left:var(--pad);padding-right:var(--pad);scroll-padding:0 var(--pad)}
.frow::-webkit-scrollbar{display:none}
.frow + .frow{margin-top:6px}
.fchip{flex:none;height:38px;padding:0 13px;border-radius:19px;border:1.5px solid var(--line);background:var(--surface);font-size:14px;font-weight:600;white-space:nowrap;display:flex;align-items:center;gap:6px}
.fchip b{font-weight:600;color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.fchip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.fchip[aria-pressed="true"] b{color:inherit;opacity:.75}
.frow.sub .fchip{height:34px;font-size:13px;border-radius:17px}
.fchip.sale{border-color:color-mix(in srgb,var(--sale) 45%,var(--line));color:var(--sale)}
.fchip.sale[aria-pressed="true"]{background:var(--sale);border-color:var(--sale);color:#fff}
.more{margin-top:14px}

.det-photo img.hd{object-fit:contain;background:#fff}

/* photos: own pictures fill the frame; other shops' pictures sit whole on white */
.ph,.det-photo{position:relative}
.ph-emo{font-style:normal;line-height:1}
.ph img,.det-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.ph img.ext,.det-photo img.ext{object-fit:contain;padding:6%}
.ph img.ext,.det-photo img.ext{opacity:0;transition:opacity .15s}
.ph img.ext.ok,.det-photo img.ext.ok{opacity:1}
@media (prefers-reduced-motion:reduce){.ph img.ext,.det-photo img.ext{transition:none}}
.ph img.ext.lowres{padding:18%}
.det-photo img.ext.lowres{padding:20%}

.dialog p{white-space:pre-line}
</style>
</head>

/* LocalStore: IndexedDB in this browser — used only in ?demo mode */
const LocalStore = {
  mode: 'local', mem: {}, listeners: {}, idb: null,
  async init(){ try { await this.openIdb(); } catch (e) { this.idb = null; } },
  openIdb(){
    return new Promise((res, rej) => {
      if (!('indexedDB' in window)) return rej(new Error('no idb'));
      const rq = indexedDB.open('kod-yaddasim-demo', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('docs', {keyPath: 'k'});
      rq.onerror = () => rej(rq.error);
      rq.onsuccess = () => {
        this.idb = rq.result;
        const tx = this.idb.transaction('docs').objectStore('docs').getAll();
        tx.onsuccess = () => { for (const r of tx.result) (this.mem[r.col] ??= {})[r.id] = r.data; res(); };
        tx.onerror = () => rej(tx.error);
      };
    });
  },
  idbDo(fn){
    if (!this.idb) return Promise.resolve();
    return new Promise((res, rej) => {
      const tx = this.idb.transaction('docs', 'readwrite'); fn(tx.objectStore('docs'));
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  },
  list(col){ return Object.entries(this.mem[col] || {}).map(([id, d]) => ({...d, id})); },
  emit(col){ for (const cb of this.listeners[col] || []) cb(this.list(col), {fromCache: false}); },
  subscribe(col, cb){
    (this.listeners[col] ??= []).push(cb);
    queueMicrotask(() => cb(this.list(col), {fromCache: false}));
    return () => { this.listeners[col] = (this.listeners[col] || []).filter(f => f !== cb); };
  },
  async put(col, id, data){
    const body = {...data}; delete body.id;
    (this.mem[col] ??= {})[id] = body;
    await this.idbDo(s => s.put({k: col + '/' + id, col, id, data: body}));
    this.emit(col);
  },
  async patch(col, id, fields){ return this.put(col, id, {...(this.mem[col] || {})[id], ...fields}); },
  watchDoc(col, id, cb){ return this.subscribe(col, docs => cb(docs.find(d => d.id === id) || null, {fromCache: false})); },
  async remove(col, id){
    if (this.mem[col]) delete this.mem[col][id];
    await this.idbDo(s => s.delete(col + '/' + id));
    this.emit(col);
  },
};
let FBX = null;   // loaded Firebase modules + instances
let Store = null;
async function loadFirebase(){
  const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
  const [appM, authM, fsM] = await Promise.all([
    import(base + 'firebase-app.js'), import(base + 'firebase-auth.js'), import(base + 'firebase-firestore.js')]);
  const app = appM.initializeApp(FIREBASE_CONFIG);
  const auth = authM.getAuth(app);
  try { auth.languageCode = 'az'; } catch (e) {}
  let db;
  try { db = fsM.initializeFirestore(app, {localCache: fsM.persistentLocalCache({tabManager: fsM.persistentMultipleTabManager()})}); }
  catch (e) { db = fsM.getFirestore(app); }
  FBX = {appM, authM, fsM, app, auth, db};
  Store = {
    mode: 'firebase',
    subscribe(col, cb, onErr, opts){
      /* opts.sync: also hear the moment the cached copy is confirmed by the server */
      let first = true;
      return fsM.onSnapshot(fsM.collection(db, col), {includeMetadataChanges: !!(opts && opts.sync)},
        s => {
          const onlyMeta = !first && s.docChanges().length === 0; first = false;
          cb(s.docs.map(d => ({...d.data(), id: d.id})), {fromCache: s.metadata.fromCache, onlyMeta});
        },
        e => onErr && onErr(e));
    },
    put(col, id, data){ const b = {...data}; delete b.id; return fsM.setDoc(fsM.doc(db, col, id), b); },
    patch(col, id, fields){ return fsM.updateDoc(fsM.doc(db, col, id), fields); },
    remove(col, id){ return fsM.deleteDoc(fsM.doc(db, col, id)); },
    watchDoc(col, id, cb, onErr){
      return fsM.onSnapshot(fsM.doc(db, col, id),
        s => cb(s.exists() ? {...s.data(), id: s.id} : null, {fromCache: s.metadata.fromCache}),
        e => onErr && onErr(e));
    },
  };
}
/* Firestore writes resolve only when the server confirms. The local cache shows
   the change at once, so the UI never waits; errors arrive as a toast. */
function bg(promise, okMsg){
  return Promise.resolve(promise).then(() => { if (okMsg) {} }, e => toast(writeError(e)));
}
function writeError(e){
  const code = String(e && e.code || '');
  if (code.includes('permission-denied')) return 'Bu hesabın yazmağa icazəsi yoxdur.';
  if (code.includes('resource-exhausted')) return 'Firebase-in gündəlik pulsuz limiti doldu. Sabah yenidən cəhd edin.';
  if (code.includes('invalid-argument')) return 'Məlumat çox böyükdür. Şəkli yenidən çəkin.';
  if (code.includes('unauthenticated')) return 'Yenidən daxil olun.';
  return 'Yadda saxlanmadı. İnterneti yoxlayın.';
}

/* ================= overlays + back button ================= */
const stack = []; let ignorePop = 0;
function wireOverlay(node){
  node.addEventListener('click', ev => { if (ev.target.closest('[data-close]') || ev.target.classList.contains('scrim')) { if (stack[stack.length - 1] === node) closeTop(); } });
}
function pushOverlay(node){
  stack.push(node); $('#overlays').appendChild(node); wireOverlay(node);
  requestAnimationFrame(() => requestAnimationFrame(() => node.classList.add('open')));
  try { history.pushState({ov: stack.length}, ''); node._pushed = true; } catch (e) { node._pushed = false; }
  return node;
}
function dropNode(node){ node.classList.remove('open'); node._onclose && node._onclose(); setTimeout(() => node.remove(), 240); }
function closeTop(fromPop){
  const node = stack.pop(); if (!node) return;
  dropNode(node);
  if (stack.length && stack[stack.length - 1]._onresume) stack[stack.length - 1]._onresume();
  if (!fromPop && node._pushed) { ignorePop++; try { history.back(); } catch (e) { ignorePop--; } }
}
function swapTop(node){
  const old = stack.pop(); if (old) { dropNode(old); node._pushed = old._pushed; }
  stack.push(node); $('#overlays').appendChild(node); wireOverlay(node);
  requestAnimationFrame(() => requestAnimationFrame(() => node.classList.add('open')));
  return node;
}
window.addEventListener('popstate', () => {
  if (ignorePop > 0) { ignorePop--; return; }
  if (stack.length) { closeTop(true); return; }
  route();
});
window.addEventListener('hashchange', () => { while (stack.length) dropNode(stack.pop()); route(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && stack.length) closeTop(); });

let toastT;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2800);
}
function askConfirm(text, okLabel = 'Bəli', danger = false){
  return new Promise(res => {
    const node = el(`<div class="overlay"><div class="scrim"></div><div class="dialog" role="alertdialog" aria-modal="true">
      <p>${esc(text)}</p><div class="row"><button class="btn ghost" data-no>Ləğv et</button><button class="btn ${danger ? 'danger' : ''}" data-yes>${esc(okLabel)}</button></div></div></div>`);
    let done = false; const finish = v => { if (!done) { done = true; res(v); } };
    node._onclose = () => finish(false);
    node.querySelector('[data-no]').onclick = () => closeTop();
    node.querySelector('[data-yes]').onclick = () => { finish(true); closeTop(); };
    pushOverlay(node);
  });
}
async function copyText(text){
  try { await navigator.clipboard.writeText(text); return true; }
  catch (e) {
    const ta = el('<textarea style="position:fixed;opacity:0"></textarea>'); ta.value = text; document.body.appendChild(ta);
    ta.select(); let ok = false; try { ok = document.execCommand('copy'); } catch (_) {} ta.remove(); return ok;
  }
}
function pickFile(kind){
  return new Promise(res => { const inp = $('#file-' + kind); inp.value = ''; inp.onchange = () => res(inp.files[0] || null); inp.click(); });
}

function loadImage(src){
  return new Promise((res, rej) => {
    const i = new Image(); i.crossOrigin = 'anonymous'; i.onload = () => res(i); i.onerror = rej;
    i.src = src instanceof Blob ? URL.createObjectURL(src) : src;
  });
}
async function imageFrom(src){
  if (src instanceof Blob) { try { return await createImageBitmap(src, {imageOrientation: 'from-image'}); } catch (e) {} }
  return loadImage(src);
}
const dims = img => [img.videoWidth || img.width || img.naturalWidth, img.videoHeight || img.height || img.naturalHeight];
/* centre square of any image/video/canvas onto a new canvas */
function squareCanvas(src, size, frac = 1){
  const [w, h] = dims(src), side = Math.min(w, h) * frac;
  const cv = document.createElement('canvas'); cv.width = cv.height = size;
  const cx = cv.getContext('2d', {willReadFrequently: true}); cx.imageSmoothingQuality = 'high';

function codeLine(p){
  const code = fmtCode(p.code);
  if (code) return `<span class="code">${esc(code)}</span>`;
  const cs = codesOf(p), k = cs[HOME_STORE] ? HOME_STORE : Object.keys(cs)[0];
  if (k) return `<span class="code none">${esc(storeName(k))} kodu ${esc(cs[k])}</span>`;
  return `<span class="code none">Kod yoxdur</span>`;
}
/* photo inside a card: our own pictures fill the frame; other shops' pictures sit whole on
   white, small ones are not blown up, and a picture that fails falls back to the other shop's */
function photoHtml(p, c, big = false){
  const emo = esc(c ? c.emoji : '📦');
  const src = big ? (hdReady.get(p.photoUrl) || p.photo || p.photoUrl) : p.photo;
  if (!src) return emo;
  const ext = !ownPhoto(p) && !(big && hdReady.has(p.photoUrl));
  if (!ext) return `<i class="ph-emo" aria-hidden="true">${emo}</i><img src="${esc(src)}" alt="${big ? esc(p.name) : ''}" ${big ? '' : 'loading="lazy"'} decoding="async">`;
  /* another shop's picture stays hidden until its size is known, so it never jumps */
  const known = sizeHints ? extSize.get(src) : null, url = known === 'bad' && p.photoAlt ? p.photoAlt : src, k = sizeHints ? extSize.get(url) : null;
  if (k === 'bad') return emo;
  const cls = k ? 'ext ok' + (k === 'small' ? ' lowres' : '') : 'ext';
  return `<i class="ph-emo" aria-hidden="true">${emo}</i><img src="${esc(url)}" alt="${big ? esc(p.name) : ''}" ${big ? '' : 'loading="lazy"'} decoding="async"`
    + ` class="${cls}" data-alt="${esc(url === src ? p.photoAlt || '' : '')}" onload="kyImgOk(this)" onerror="kyImgBad(this)">`;
}
const extSize = new Map();   // shop picture address -> 'small' | 'big' | 'bad'
let sizeHints = true;        // off while a card's look is compared: what we learnt about a picture is not a change
window.kyImgOk = img => {
  const small = img.naturalWidth && Math.max(img.naturalWidth, img.naturalHeight) < 280;
  extSize.set(img.getAttribute('src'), small ? 'small' : 'big');
  img.classList.toggle('lowres', !!small); img.classList.add('ok');
};
window.kyImgBad = img => {
  extSize.set(img.getAttribute('src'), 'bad');
  const a = img.dataset.alt; if (a && img.getAttribute('src') !== a) { img.dataset.alt = ''; img.classList.remove('ok', 'lowres'); img.src = a; } else img.remove();
};
function productCard(p, showCat){
  const c = catById(p.catId), m = mainPrice(p);
  return `<button class="card" data-id="${esc(p.id)}" style="--t:${tintOf(c)}">
    <span class="ph">${photoHtml(p, c)}
      ${m && m.s != null ? `<span class="off">−${offPct(m)}%</span>` : ''}</span>
    <span class="nm">${esc(p.name)}</span>
    ${priceTag(p)}
    ${codeLine(p)}
    ${showCat && c ? `<span class="cat-chip">${esc(c.emoji)} ${esc(c.name)}</span>` : ''}
  </button>`;
}
function bindCards(root){
  $$('.card', root).forEach(bindCard);
}
function bindCard(b){ b.addEventListener('click', () => { const p = S.products.find(x => x.id === b.dataset.id); if (p) openDetail(p); }); }
/* draws a card list into box, keeping every card whose look has not changed: its picture
   is not loaded again, so pictures do not flicker when data arrives or more cards are added */
function putCards(box, head, list, showCat){
  let grid = box.querySelector(':scope > .grid'), top = box.querySelector(':scope > .cards-head'), tail = box.querySelector(':scope > .cards-tail');
  if (!grid || !top || !tail) {
    box.innerHTML = '<div class="cards-head"></div><div class="grid"></div><div class="cards-tail"></div>';
    top = box.firstElementChild; grid = top.nextElementSibling; tail = grid.nextElementSibling;
  }
  if (top.innerHTML !== head) top.innerHTML = head;
  const shown = list.slice(0, S.limit), rest = list.length - shown.length;
  const old = new Map([...grid.children].map(e => [e.dataset.id, e]));
  let prev = null;
  for (const p of shown) {
    sizeHints = false; let h; try { h = productCard(p, showCat); } finally { sizeHints = true; }
    let e = old.get(p.id);
    if (e && e._h === h) old.delete(p.id);
    else { e = el(productCard(p, showCat)); e._h = h; bindCard(e); }
    const want = prev ? prev.nextElementSibling : grid.firstElementChild;
    if (e !== want) grid.insertBefore(e, want);
    prev = e;
  }
  for (const e of old.values()) e.remove();
  const more = rest > 0 ? `<button class="btn ghost wide more" id="more">Daha çox göstər (${rest} qalıb)</button>` : '';
  if (tail.innerHTML !== more) tail.innerHTML = more;
  bindMore(box);
}
/* a long list draws PAGE cards at a time; the rest come in as you scroll */
function cardList(list, showCat){
  const shown = list.slice(0, S.limit), rest = list.length - shown.length;
  return `<div class="grid">${shown.map(p => productCard(p, showCat)).join('')}</div>`
    + (rest > 0 ? `<button class="btn ghost wide more" id="more">Daha çox göstər (${rest} qalıb)</button>` : '');
}
let moreObs = null;
function bindMore(box){
  const b = $('#more', box); if (moreObs) { moreObs.disconnect(); moreObs = null; }
  if (!b) return;
  const go = () => { if (moreObs) { moreObs.disconnect(); moreObs = null; } S.limit += PAGE; renderContent(); };
  b.onclick = go;
  if ('IntersectionObserver' in window) {
    moreObs = new IntersectionObserver(es => { if (es.some(e => e.isIntersecting)) go(); }, {rootMargin: '600px 0px'});
    moreObs.observe(b);
  }
}
/* sub-category rows: Şirniyyat → Şirniyyat çəki → Karamel çəki → … ; plus "on sale" */
function renderFilters(allCat){
  const f = $('#filters'); if (!f) return;
  const shopN = {}; for (const p of allCat) for (const k of storesOf(p)) shopN[k] = (shopN[k] || 0) + 1;
  const shops = Object.keys(shopN).sort((a, b) => STORES.findIndex(s => s.id === a) - STORES.findIndex(s => s.id === b));
  if (S.shop && !shopN[S.shop]) S.shop = null;
  const all = S.shop ? allCat.filter(p => pricesOf(p)[S.shop]) : allCat;
  const hasPath = all.some(p => pathOf(p).length), saleN = all.filter(onSale).length;
  if (!hasPath && !saleN && shops.length < 2) { f.innerHTML = ''; return; }
  const rows = [];
  if (shops.length > 1) rows.push(`<div class="frow shops" data-key="shops" role="group" aria-label="Mağaza">
    <button class="fchip" data-shop="" aria-pressed="${!S.shop}">Bütün mağazalar <b>${allCat.length}</b></button>
    ${shops.map(k => `<button class="fchip" data-shop="${esc(k)}" aria-pressed="${S.shop === k}">${esc(storeName(k))} <b>${shopN[k]}</b></button>`).join('')}</div>`);
  for (let lvl = 0; lvl <= S.sel.length && lvl < 6; lvl++) {
    const base = all.filter(p => inPath(p, S.sel.slice(0, lvl)) && (!S.saleOnly || onSale(p)));
    const counts = new Map();
    for (const p of base) { const v = pathOf(p)[lvl]; if (v) counts.set(v, (counts.get(v) || 0) + 1); }
    if (!counts.size || (counts.size === 1 && !S.sel[lvl] && lvl > 0)) break;
    const opts = [...counts].sort((a, b) => collator.compare(a[0], b[0]));
    const lead = lvl === 0 && saleN
      ? `<button class="fchip sale" data-sale aria-pressed="${S.saleOnly}">Endirimdə <b>${all.filter(p => inPath(p, S.sel) && onSale(p)).length}</b></button>` : '';
    rows.push(`<div class="frow ${lvl ? 'sub' : ''}" data-lvl="${lvl}" data-key="${esc(lvl + '|' + S.sel.slice(0, lvl).join('>'))}" role="group" aria-label="${lvl ? 'Alt kateqoriya' : 'Kateqoriya'}">${lead}
      <button class="fchip" data-v="" aria-pressed="${!S.sel[lvl]}">Hamısı <b>${base.length}</b></button>
      ${opts.map(([v, n]) => `<button class="fchip" data-v="${esc(v)}" aria-pressed="${S.sel[lvl] === v}">${esc(v)} <b>${n}</b></button>`).join('')}</div>`);
  }
  if (!hasPath && saleN) rows.push(`<div class="frow"><button class="fchip" data-sale-off aria-pressed="${!S.saleOnly}">Hamısı <b>${all.length}</b></button>
    <button class="fchip sale" data-sale aria-pressed="${S.saleOnly}">Endirimdə <b>${saleN}</b></button></div>`);
  const keep = new Map($$('.frow', f).map(r => [r.dataset.key, r.scrollLeft]));
  f.innerHTML = rows.join('');
  $$('.frow', f).forEach(r => {
    const on = $('.fchip[data-v][aria-pressed="true"]', r);
    if (keep.has(r.dataset.key)) r.scrollLeft = keep.get(r.dataset.key);
    else if (on && on.dataset.v) r.scrollLeft = Math.max(0, on.offsetLeft - 40);
  });
  $$('.fchip', f).forEach(b => b.onclick = () => {
    if (b.hasAttribute('data-shop')) { S.shop = b.dataset.shop || null; S.sel = []; }
    else if (b.hasAttribute('data-sale')) S.saleOnly = !S.saleOnly;
    else if (b.hasAttribute('data-sale-off')) S.saleOnly = false;
    else {
      const lvl = +b.closest('.frow').dataset.lvl;
      S.sel = S.sel.slice(0, lvl); if (b.dataset.v) S.sel[lvl] = b.dataset.v;
    }
    S.limit = PAGE; renderContent();
  });
}
function renderContent(){

      box.innerHTML = `<div class="empty-state"><p>Bu kateqoriyada hələ məhsul yoxdur.</p>${can.edit() ? `<button class="btn" id="empty-add">${ICON.camera}Şəkil çəkib əlavə et</button>` : ''}</div>`;

    const n = S.products.filter(p => p.catId === c.id).length;
    return `<a class="tile ${odd && i === S.cats.length - 1 ? 'wide' : ''}" href="#c-${encodeURIComponent(c.id)}" style="--t:${tintOf(c)}">
      <span class="tile-emoji" aria-hidden="true">${esc(c.emoji || '📦')}</span>
      <span class="tile-count" aria-label="${n} məhsul">${n}</span>
      <span class="tile-name">${esc(c.name)}</span></a>`;
  }).join('')}</nav>`;
}

/* ================= detail ================= */
const hdReady = new Map();   // shop photo url -> sharp, trimmed copy for the detail view
/* every shop, cheapest first, regular and sale price side by side */
function priceTable(p){

  const best = nowPrice(rows[0]), several = rows.length > 1, u = UNIT_LABEL[p.unit] || 'kq', codes = codesOf(p);
  const when = x => x.from || x.to ? [x.from, x.to].filter(Boolean).map(fmtDay).join(' – ') : x.at ? fmtDay(x.at) : '';

          ${storeIds.map(id => { const o = oldPrices[id] || {}; return `
          <label class="pg-store" for="f-r-${esc(id)}">${esc(storeName(id))}</label>

          <input class="inp" id="f-s-${esc(id)}" data-id="${esc(id)}" data-k="s" inputmode="decimal" autocomplete="off" placeholder="—" aria-label="${esc(storeName(id))}, endirimli qiymət" value="${pv(o.s)}">

      <div class="field"><label for="f-code">Kod</label>
        <input class="inp" id="f-code" inputmode="numeric" autocomplete="off" value="${esc(d.code)}" placeholder="Məs. 2717071">
        ${Object.keys(codesOf(d)).length ? `<p class="hint">${Object.entries(codesOf(d)).map(([k, v]) => esc(storeName(k)) + ' kodu: ' + esc(v)).join(', ')}</p>` : ''}</div>
      <div class="form-actions">
        <button type="button" class="btn ghost" data-close>Ləğv et</button>
        <button type="submit" class="btn" id="f-save">Yadda saxla</button>
      </div>
    </form>`;
  let photo = d.photo || '', unit = d.unit === 'ed' ? 'ed' : 'kq';
  /* every branch already used in the chosen category, plus the product's own */
  const drawPaths = () => {
    const catId = $('#f-cat', sheet).value, cur = catId === d.catId ? pathOf(d).join(' › ') : '';
    const keys = new Set(S.products.filter(p => p.catId === catId && pathOf(p).length).map(p => pathOf(p).join(' › ')));
    if (cur) keys.add(cur);
    const list = [...keys].sort(collator.compare);
    $('#f-pathbox', sheet).hidden = !list.length;
    $('#f-path', sheet).innerHTML = `<option value="">— seçilməyib —</option>` + list.map(k => `<option value="${esc(k)}" ${k === cur ? 'selected' : ''}>${esc(k)}</option>`).join('');
  };
  drawPaths();
  $('#f-cat', sheet).addEventListener('change', drawPaths);
  const box = $('#f-photo', sheet);
  const drawPhoto = () => { box.innerHTML = photo ? `<img src="${esc(photo)}" alt="Məhsulun şəkli">` : ICON.camera; };
  drawPhoto();
  const take = async kind => { const f = await pickFile(kind); if (!f) return; try { photo = await fileToPhoto(f); drawPhoto(); } catch (e) { toast('Şəkli açmaq olmadı'); } };
  box.onclick = () => take('cam'); $('#f-cam', sheet).onclick = () => take('cam'); $('#f-gal', sheet).onclick = () => take('gal');
  $$('.seg button', sheet).forEach(b => b.onclick = () => { unit = b.dataset.unit; $$('.seg button', sheet).forEach(x => x.setAttribute('aria-pressed', String(x === b))); });
  /* prices: blank = none; "4,80" works too */
  const parse = raw => { const t = String(raw).trim().replace(',', '.'); if (!t) return {empty: true}; const v = Number(t); return isNaN(v) || v < 0 ? {bad: true} : {v: Math.round(v * 100) / 100}; };
  const readStore = id => ({r: parse($('#f-r-' + CSS.escape(id), sheet).value), s: parse($('#f-s-' + CSS.escape(id), sheet).value)});
  const drawPct = id => {
    const {r, s} = readStore(id), out = $('#f-p-' + CSS.escape(id), sheet);
    out.textContent = r.v != null && s.v != null && s.v < r.v ? '−' + Math.round((1 - s.v / r.v) * 100) + '%' : '';
  };
  storeIds.forEach(drawPct);
  $$('.pgrid input', sheet).forEach(i => i.addEventListener('input', () => drawPct(i.dataset.id)));
  if (prefill.focusPrices) setTimeout(() => { const t = $('#f-prices', sheet); t.scrollIntoView({block: 'start'}); }, 280);
  $('form', sheet).addEventListener('submit', async ev => {
    ev.preventDefault();
    const name = $('#f-name', sheet).value.trim(), code = $('#f-code', sheet).value.trim();
    $('#w-name', sheet).hidden = !!name;
    if (!name) { $('#f-name', sheet).focus(); return; }
    const prices = {}; let problem = null, where = null;
    for (const id of storeIds) {
      const {r, s} = readStore(id), nm = storeName(id);
      if (r.bad || s.bad) { problem = `${nm}: qiyməti rəqəmlə yazın, məs. 4.80`; where = r.bad ? 'r' : 's'; }
      else if (r.empty && !s.empty) { problem = `${nm}: əvvəlcə endirimsiz qiyməti yazın`; where = 'r'; }
      else if (!s.empty && s.v >= r.v) { problem = `${nm}: endirimli qiymət endirimsizdən az olmalıdır`; where = 's'; }
      if (problem) { $('#f-' + where + '-' + CSS.escape(id), sheet).focus(); break; }
      if (r.empty) continue;
      const old = (p && p.prices && p.prices[id]) || {}, before = oldPrices[id] || {};
      const sv = s.empty ? null : s.v;
      const same = before.r === r.v && (before.s ?? null) === sv;
      const row = {...old, r: r.v, s: sv, at: same && old.at ? old.at : Date.now()};
      if (!same) { delete row.from; delete row.to; }   // typed by hand: no longer the leaflet's dates
      prices[id] = row;
    }
    const warn = $('#w-price', sheet); warn.hidden = !problem; warn.textContent = problem || '';
    if (problem) return;
    const id = isNew ? uid() : p.id;
    const dup = digits(code) && S.products.find(x => x.id !== id && digits(x.code) === digits(code));
    if (dup && !await askConfirm(`Bu kod artıq «${dup.name}» məhsulundadır. Yenə də yadda saxlansın?`, 'Saxla')) return;
    const btn = $('#f-save', sheet); btn.disabled = true; btn.textContent = 'Saxlanılır…';
    const home = prices[HOME_STORE] || prices[Object.keys(prices)[0]];
    const item = {...(p || {}), name, catId: $('#f-cat', sheet).value, prices, price: home ? home.r : null,
      unit, code, photo, createdAt: (p && p.createdAt) || Date.now(), updatedAt: Date.now(),
      createdBy: (p && p.createdBy) || myEmail(), updatedBy: myEmail()};
    delete item.id;
    const chosen = $('#f-path', sheet).value, chosenPath = chosen ? chosen.split(' › ') : [];
    if (chosenPath.join('›') !== pathOf(p || {}).join('›') || (p && p.catId !== item.catId)) { item.path = chosenPath; item.pathManual = true; }
    const samePhoto = p && p.photo === photo;
    item.sig = samePhoto && Array.isArray(p.sig) ? p.sig : null;
    item.emb = samePhoto && p.emb && p.embModel === MODEL_ID ? p.emb : null;
    item.embModel = item.emb ? MODEL_ID : null;
    if (!samePhoto) { item.emb2 = null; item.photoUrl = null; }
    item.refs = samePhoto && Array.isArray(p.refs) ? p.refs : [];
    if (photo && photo.startsWith('data:')) {
      try {
        const img = await loadImage(photo);
        if (!item.sig) item.sig = sigFromImage(img);
        if (!item.emb && embedder) { const v = vecFromCanvas(squareCanvas(img, AI_SIZE)); if (v) { item.emb = encVec(v); item.embModel = MODEL_ID; } }
      } catch (e) {}
    }
    bg(Store.put('products', id, item));
    toast('Yadda saxlandı');
    if (isNew) closeTop(); else openDetail({...item, id}, {swap: true});
  });
  return node;
}

function miniRow(p){

  return `<button class="pick" data-id="${esc(p.id)}" style="--t:${tintOf(c)}"><span class="ph">${photoHtml(p, c)}</span>

}
function bestCard(p, badge, soft, pct){
  const c = catById(p.catId), code = fmtCode(p.code);
  return `<button class="best" data-id="${esc(p.id)}" style="--t:${tintOf(c)}">
    <span class="ph">${photoHtml(p, c)}</span>
    <span class="info"><span class="badge ${soft ? 'soft' : ''}">${esc(badge)}</span>
      <span class="nm">${esc(p.name)}</span>${priceTag(p)}
      ${code ? `<span class="code">${esc(code)}</span>` : `<span class="code none">Kod yoxdur</span>`}
      ${pct != null ? `<span class="pct">Oxşarlıq: ${pct}%</span>` : ''}</span></button>`;
}
const pctOf = (mode, s) => Math.max(0, Math.min(100, Math.round(s * 100)));

function openScanner(){
  const node = el(`<div class="overlay scan-ov" role="dialog" aria-modal="true" aria-label="Skan">
    <div class="scan-top"><button class="icon-btn light" data-close aria-label="Bağla">${ICON.close}</button>
      <p>Məhsulu çərçivəyə gətirin</p><span class="ai-chip" id="sc-ai"></span></div>
    <div class="scan-stage" id="sc-stage"><video playsinline muted autoplay></video><div class="scan-frame" id="sc-frame"></div>
      <div class="scan-msg" id="sc-msg">${ICON.scan}<span>Kamera açılır…</span></div></div>
    <div class="scan-panel"><div id="sc-res"><p class="live-hint">Məhsul axtarılır…</p></div>
      <div class="row"><button class="btn ghost" id="sc-shot" type="button">${ICON.camera}Şəkil çək</button>
        <button class="btn ghost" id="sc-gal" type="button">${ICON.image}Qalereyadan</button></div></div></div>`);
  const stage = $('#sc-stage', node), video = $('video', node), msg = $('#sc-msg', node), res = $('#sc-res', node);
  const chip = $('#sc-ai', node), frame = $('#sc-frame', node);
  let stream = null, stopped = false, timer = null, lastQ = null, history3 = [], shown = null;
  const work = document.createElement('canvas'); work.width = work.height = AI_SIZE;
  const wctx = work.getContext('2d', {willReadFrequently: true});
  const drawChip = () => {
    chip.textContent = embedder ? 'Süni intellekt' : S.ai === 'error' ? 'Rəngə görə' : 'Model yüklənir…';
    chip.classList.toggle('ok', !!embedder);
  };
  drawChip();
  if (!embedder) getEmbedder().then(drawChip, drawChip);
  const stopCam = () => { stopped = true; clearTimeout(timer); if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; } };
  node._onclose = stopCam;
  node._onresume = () => { if (stream && stopped) { stopped = false; loop(); } };
  const isTop = () => stack[stack.length - 1] === node;

  async function start(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { noCam('Bu brauzerdə canlı kamera işləmir. «Şəkil çək» düyməsindən istifadə edin.'); return; }
    try {
      stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}, height: {ideal: 1280}}, audio: false});
      if (stopped) { stopCam(); return; }
      video.srcObject = stream; await video.play().catch(() => {});
      stage.classList.add('live'); loop();
    } catch (e) {
      noCam('Kameranı açmaq olmadı. Brauzerə kamera icazəsi verin, ya da «Şəkil çək» düyməsindən istifadə edin.');
    }
  }
  function noCam(text){ stage.classList.remove('live'); msg.innerHTML = `${ICON.scan}<span>${esc(text)}</span>`; res.innerHTML = ''; }

  async function frameQuery(){
    const [vw, vh] = dims(video); if (!vw) return null;
    const side = Math.min(vw, vh) * 0.75, inner = side * 0.66;
    wctx.drawImage(video, (vw - side) / 2, (vh - side) / 2, side, side, 0, 0, AI_SIZE, AI_SIZE);
    const vec = vecFromCanvas(work), sig = sigFromImage(work);
    wctx.drawImage(video, (vw - inner) / 2, (vh - inner) / 2, inner, inner, 0, 0, AI_SIZE, AI_SIZE);
    return {vec, vecs: [vec, vecFromCanvas(work)], sig};
  }
  async function loop(){
    if (stopped) return;
    if (!isTop() || document.hidden) { timer = setTimeout(loop, 400); return; }
    try {
      const q = await frameQuery();
      if (q) {
        lastQ = q;
        const r = await rankQuery(q);
        update(r);
      }
    } catch (e) {}
    timer = setTimeout(loop, embedder ? 220 : 350);
  }
  function update(r){
    if (!S.products.some(ownPhoto)) { res.innerHTML = '<p class="live-hint">Hələ şəkilli məhsul yoxdur. Əvvəlcə məhsul əlavə edin.</p>'; return; }
    const top = r.list[0];
    const v = top ? verdict(r.mode, top.score, r.gap) : 'none';
    history3.push(v === 'none' ? null : top.p.id); if (history3.length > 3) history3.shift();
    const votes = history3.filter(id => top && id === top.p.id).length;
    if (v === 'none' || votes < 2) {
      if (!shown || v === 'none') { frame.classList.remove('hit'); if (shown !== '__hint') { res.innerHTML = '<p class="live-hint">Məhsulu çərçivəyə yaxın tutun</p>'; shown = '__hint'; } }
      return;
    }
    frame.classList.add('hit');
    const key = top.p.id + ':' + v + ':' + pctOf(r.mode, top.score) + ':' + (top.p.updatedAt || 0);
    if (shown === key) return; shown = key;
    const alts = r.list.slice(1, 4).filter(x => verdict(r.mode, x.score) !== 'none');
    res.innerHTML = bestCard(top.p, v === 'sure' ? 'Tapıldı' : 'Ən oxşar', v !== 'sure', pctOf(r.mode, top.score))
      + (alts.length ? `<div class="live-alt">${alts.map(a => `<button data-id="${esc(a.p.id)}">${esc(a.p.name)}</button>`).join('')}</div>` : '');
    $$('[data-id]', res).forEach(b => b.onclick = () => {
      const p = S.products.find(x => x.id === b.dataset.id); if (!p) return;
      if (lastQ && lastQ.vec) learn(p, lastQ.vec);
      openDetail(p);
    });
  }
  async function still(src){
    stopped = true; clearTimeout(timer);
    try {
      const img = src instanceof Blob ? await imageFrom(src) : src;
      const photo = photoFrom(img, src instanceof Blob ? 1 : 0.75);
      const full = src instanceof Blob ? 1 : 0.75;
      const cv = squareCanvas(img, AI_SIZE, full), tight = squareCanvas(img, AI_SIZE, full * 0.66);
      openResults({photo, vecs: [vecFromCanvas(cv), vecFromCanvas(tight)], sig: sigFromImage(cv)});
    } catch (e) { toast('Şəkli açmaq olmadı'); node._onresume(); }
  }
  $('#sc-shot', node).onclick = async () => {
    if (stream && video.videoWidth) { still(video); return; }
    const f = await pickFile('scan'); if (f) still(f);
  };
  $('#sc-gal', node).onclick = async () => { const f = await pickFile('gal'); if (f) still(f); };
  pushOverlay(node);
  start();
}

function openResults(q){
  const node = el(`<div class="overlay"><div class="scrim"></div><div class="sheet" role="dialog" aria-modal="true" aria-label="Nəticə">
    <div class="grab"></div>
    <div class="sheet-bar"><h2>Nəticə</h2><button class="icon-btn" data-close aria-label="Bağla">${ICON.close}</button></div>
    <div id="r-body"><p class="rec-status"><span class="spin"></span>Axtarılır…</p></div></div></div>`);
  pushOverlay(node);
  const body = $('#r-body', node);
  (async () => {
    const r = await rankQuery(q);
    const top = r.list[0], v = top ? verdict(r.mode, top.score, r.gap) : 'none';
    let status, best = null;
    if (!r.list.length) status = 'Müqayisə üçün şəkilli məhsul yoxdur.';
    else if (v === 'sure') { best = top.p; status = '<b>Məhsul tapıldı.</b>'; }
    else if (v === 'maybe') { best = top.p; status = 'Tam əmin deyiləm. Yoxlayın, lazımsa aşağıdan seçin.'; }
    else status = '<b>Bu məhsul tapılmadı.</b> Aşağıdakılardan biridirsə seçin, ya da yeni məhsul kimi əlavə edin.';
    const others = r.list.map(x => x.p).filter(p => p !== best).slice(0, 6);
    body.innerHTML = `
      <div class="rec-head"><div class="rec-q"><img src="${esc(q.photo)}" alt="Çəkdiyiniz şəkil"></div><p class="rec-status">${status}</p></div>
      ${best ? bestCard(best, v === 'sure' ? 'Tapıldı' : 'Ən oxşar', v !== 'sure', pctOf(r.mode, top.score)) : ''}
      ${others.length ? `<p class="rec-sub">${best ? 'Bu deyilsə' : 'Oxşar məhsullar'}</p><div class="pick-list">${others.map(miniRow).join('')}</div>` : ''}
      <div class="rec-actions"><button class="btn ghost" data-close>${ICON.scan}Yenidən skan</button>
        ${can.edit() ? `<button class="btn" id="r-new">${ICON.plus}Yeni məhsul</button>` : ''}</div>`;
    $$('[data-id]', body).forEach(b => b.onclick = () => {
      const p = S.products.find(x => x.id === b.dataset.id); if (!p) return;
      learn(p, (q.vecs || [q.vec])[0]); openDetail(p);
    });
    if ($('#r-new', body)) $('#r-new', body).onclick = () => swapTop(buildForm(null, {photo: q.photo, catId: S.route.name === 'cat' ? S.route.id : undefined}));
  })();
}

    <section class="set-sec"><h3>Ehtiyat nüsxə</h3><div class="stack">
      <button class="btn ghost wide" id="s-export">${ICON.copy}Ehtiyat nüsxəni yüklə</button>
      <button class="btn ghost wide" id="s-import">Ehtiyat nüsxədən bərpa et</button></div></section>`;
  $('#s-owner', sheet).addEventListener('change', e => saveSettings({owner: e.target.value.trim()}));
  $('#s-title', sheet).addEventListener('change', e => saveSettings({title: e.target.value.trim() || APP_NAME}));
  bindThemeChips(sheet); bindAccount(sheet);
  const memList = $('#s-memlist', sheet);
  const drawMembers = () => {
    if (memList.contains(document.activeElement)) return;
    const ms = S.members.slice().sort((a, b) => collator.compare(a.id, b.id));
    memList.innerHTML = ms.length ? ms.map(m => `<div class="mem-row" data-id="${esc(m.id)}"><span>${esc(m.id)}</span>
        <select class="inp" aria-label="İcazə"><option value="editor" ${m.role !== 'viewer' ? 'selected' : ''}>Əlavə edə bilər</option><option value="viewer" ${m.role === 'viewer' ? 'selected' : ''}>Yalnız baxır</option></select>
        <button class="sq-btn" aria-label="${esc(m.id)} sil">${ICON.trash}</button></div>`).join('')
      : '<p class="store-state">Hələ heç kim əlavə olunmayıb.</p>';
    $$('.mem-row', memList).forEach(r => {
      const id = r.dataset.id;
      $('select', r).addEventListener('change', e => bg(Store.patch('members', id, {role: e.target.value})));
      $('.sq-btn', r).onclick = async () => {
        if (await askConfirm(`«${id}» siyahıdan silinsin? Girişi dərhal bağlanacaq.`, 'Sil', true)) { bg(Store.remove('members', id)); toast('Silindi'); }
      };
    });
  };
  drawMembers();
  $('#s-memform', sheet).addEventListener('submit', ev => {
    ev.preventDefault();
    const inp = $('#s-mememail', sheet), email = inp.value.trim().toLowerCase();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { toast('E-poçtu düzgün yazın'); inp.focus(); return; }
    if (email === OWNER_EMAIL) { toast('Bu, sizin öz hesabınızdır'); return; }
    bg(Store.put('members', email, {role: $('#s-memrole', sheet).value, addedAt: Date.now()}));
    inp.value = ''; toast('Əlavə olundu');
  });
  const rows = $('#s-cats', sheet);
  const drawCats = () => {
    const ai = $('#s-ai', sheet); if (ai) ai.textContent = aiText();
    if (rows.contains(document.activeElement)) return;
    rows.innerHTML = S.cats.map(c => `<div class="cat-row" data-id="${esc(c.id)}">
      <input class="inp emo" value="${esc(c.emoji || '')}" aria-label="İkon" maxlength="4">
      <input class="inp nmi" value="${esc(c.name)}" aria-label="Kateqoriyanın adı">
      <button class="sq-btn" aria-label="${esc(c.name)} sil">${ICON.trash}</button></div>`).join('');
    $$('.cat-row', rows).forEach(r => {
      const c = catById(r.dataset.id); if (!c) return;
      const save = patch => bg(Store.put('categories', c.id, {...catById(c.id), ...patch}));
      $('.nmi', r).addEventListener('change', e => { const v = e.target.value.trim(); if (v && v !== c.name) save({name: v}); });
      $('.emo', r).addEventListener('change', e => { const v = e.target.value.trim(); if (v !== c.emoji) save({emoji: v || '📦'}); });
      $('.sq-btn', r).onclick = async () => {
        const n = S.products.filter(p => p.catId === c.id).length;
        if (n) { toast(`Əvvəlcə ${n} məhsulu başqa kateqoriyaya keçirin`); return; }
        if (await askConfirm(`«${c.name}» kateqoriyası silinsin?`, 'Sil', true)) bg(Store.remove('categories', c.id));
      };
    });
  };
  drawCats();
  $('#s-addcat', sheet).onclick = () => {
    const order = Math.max(0, ...S.cats.map(c => c.order || 0)) + 1;
    bg(Store.put('categories', 'k' + uid(), {name: 'Yeni kateqoriya', emoji: '📦', tint: TINT_CYCLE[S.cats.length % TINT_CYCLE.length], order}));
    toast('Kateqoriya əlavə olundu. Adını dəyişin.');
  };
  $('#s-repath', sheet).onclick = async () => {
    const changes = repathChanges();
    if (!changes.length) { toast('Dəyişəcək məhsul yoxdur'); return; }
    const byId = new Map(S.products.map(p => [p.id, p]));
    const sample = changes.slice(0, 5).map(([id, path]) => `• ${(byId.get(id) || {}).name} → ${path.slice(1).join(' › ')}`).join('\n');
    if (!await askConfirm(`${changes.length} məhsulun alt kateqoriyası dəyişəcək. Məsələn:\n${sample}\n\nDavam edilsin?`, 'Böl')) return;
    const btn = $('#s-repath', sheet); btn.disabled = true;
    const done = await writePaths(changes, n => { btn.textContent = `Yerləşdirilir… ${n}/${changes.length}`; });
    btn.disabled = false; btn.textContent = 'Avtomatik yenidən böl'; toast(`${done} məhsul yerləşdirildi`);
  };
  $('#s-export', sheet).onclick = () => {
    const data = JSON.stringify({app: 'kod-yaddasim', v: 2, exportedAt: new Date().toISOString(), settings: S.settings, categories: S.cats,
      products: S.products.map(p => ({...p}))});
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], {type: 'application/json'}));
    a.download = 'kod-yaddasim-' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  };
  $('#s-import', sheet).onclick = async () => {
    const f = await pickFile('json'); if (!f) return;
    let data; try { data = JSON.parse(await f.text()); } catch (e) { toast('Fayl oxunmadı'); return; }
    if (!data || data.app !== 'kod-yaddasim' || !Array.isArray(data.products)) { toast('Bu, Məhsul Bazası nüsxəsi deyil'); return; }
    if (!await askConfirm(`${data.products.length} məhsul və ${(data.categories || []).length} kateqoriya əlavə olunsun?`, 'Bərpa et')) return;
    for (const c of data.categories || []) bg(Store.put('categories', c.id, c));
    for (const p of data.products) bg(Store.put('products', p.id, p));
    toast('Bərpa olundu');
  };
  const refreshAll = () => { drawCats(); drawMembers(); };
  live.add(refreshAll); node._onclose = () => live.delete(refreshAll);
  pushOverlay(node);
}

/* ================= auth + data ================= */
let unsubs = [], memberUnsub = null;
function stopData(){ unsubs.forEach(u => { try { u(); } catch (e) {} }); unsubs = []; S.got = {categories: false, products: false, settings: false}; S.synced = {categories: false, products: false, settings: false}; S.members = []; }
function stopMember(){ if (memberUnsub) { try { memberUnsub(); } catch (e) {} memberUnsub = null; } }
/* decide who this person is: the owner, someone on the list, or nobody */
function onUser(user){
  stopData(); stopMember(); S.user = user; S.role = null;
  if (!user) { S.gate = 'login'; renderShell(); return; }
  S.gateMsg = '';
  const email = myEmail();
  if (email === OWNER_EMAIL && user.emailVerified) { S.role = 'owner'; startData(); return; }
  S.gate = 'loading'; renderShell();
  memberUnsub = Store.watchDoc('members', email, (m, meta) => {
    if (!m) {
      if (meta && meta.fromCache) return;            // wait for the server's answer
      S.role = null; stopData(); S.gate = 'denied'; renderShell(); return;
    }
    const role = m.role === 'viewer' ? 'viewer' : 'editor';
    const changed = S.role !== role; S.role = role;
    if (S.gate !== 'app') startData(); else if (changed) { renderShell(); dataChanged(); }
  }, () => { S.role = null; stopData(); S.gate = 'denied'; renderShell(); });
}
function startData(){
  stopData();
  S.gate = 'app'; renderShell();
  const onErr = e => {
    const code = String(e && e.code || '');
    if (code.includes('permission-denied')) { S.gate = 'denied'; stopData(); renderShell(); return; }
    toast('Məlumatları yükləmək olmadı. İnterneti yoxlayın.');
  };
  unsubs.push(Store.subscribe('categories', (docs, meta) => {
    S.cats = docs.sort((a, b) => (a.order || 0) - (b.order || 0) || collator.compare(a.name || '', b.name || ''));
    S.got.categories = true; if (!meta.fromCache) S.synced.categories = true;
    maybeSeed();
    if (S.route.name === 'cat') renderShell(); else dataChanged();
  }, onErr));
  unsubs.push(Store.subscribe('products', (docs, meta) => {
    if (!meta || !meta.fromCache) S.synced.products = true;
    if (!(meta && meta.onlyMeta)) { S.products = docs; S.got.products = true; dataChanged(); backfill(); }
    setTimeout(autoRepath, 2500);
  }, onErr, {sync: true}));
  if (can.admin()) unsubs.push(Store.subscribe('members', docs => { S.members = docs; for (const f of live) f(); }, () => {}));
  unsubs.push(Store.subscribe('settings', (docs, meta) => {
    if (meta && meta.onlyMeta) { if (!meta.fromCache && !S.synced.settings) { S.synced.settings = true; maybeSeed(); setTimeout(autoRepath, 2500); } return; }
    const s = docs.find(d => d.id === 'app');
    S.got.settings = true; if (!meta.fromCache) S.synced.settings = true;
    S.hasSettingsDoc = !!s;
    if (s) {
      const before = JSON.stringify(S.settings);
      S.settings = {...DEFAULT_SETTINGS, ...s}; delete S.settings.id;
      if (JSON.stringify(S.settings) !== before) renderShell();
    }
    maybeSeed(); setTimeout(autoRepath, 2500);
  }, onErr, {sync: true}));
}
/* first run on an empty database: categories + the two products from the old app */
let seeded = false;
function maybeSeed(){
  if (seeded || !can.admin() || !S.synced.categories || !S.synced.settings) return;
  seeded = true;
  if (S.cats.length || S.hasSettingsDoc) return;
  for (const c of DEFAULT_CATS) bg(Store.put('categories', c.id, c));
  for (const p of SEED_PRODUCTS) bg(Store.put('products', p.id, {...p, createdAt: Date.now(), updatedAt: Date.now()}));
  bg(Store.put('settings', 'app', {...S.settings, seeded: true}));
}
function authMsg(e){
  const code = String(e && e.code || '');
  if (code.includes('unauthorized-domain')) return `Bu ünvan (${location.hostname}) Firebase-də icazəli deyil. Firebase → Authentication → Settings → Authorized domains bölməsinə «${location.hostname}» əlavə edin.`;
  if (code.includes('operation-not-allowed')) return 'Firebase-də Google girişi aktiv deyil. Authentication → Sign-in method → Google → Enable.';
  if (code.includes('network-request-failed')) return 'İnternet bağlantısı yoxdur.';
  if (code.includes('popup-blocked')) return 'Brauzer giriş pəncərəsini blokladı. Pop-up icazəsi verin və yenidən basın.';
  return 'Giriş alınmadı (' + (code || 'xəta') + ').';
}
function emailAuthMsg(e){
  const code = String(e && e.code || '');
  if (/invalid-credential|wrong-password|user-not-found|invalid-email|missing-password/.test(code)) return 'E-poçt və ya şifrə səhvdir.';
  if (code.includes('user-disabled')) return 'Bu hesab bağlanıb.';
  if (code.includes('too-many-requests')) return 'Çox cəhd oldu. Bir az sonra yenidən yoxlayın.';
  if (code.includes('operation-not-allowed')) return 'Firebase-də şifrə ilə giriş aktiv deyil.';
  return authMsg(e);
}
async function signInEmail(email, pass){
  if (!email || !pass) { S.gateMsg = 'E-poçtu və şifrəni yazın.'; renderShell(); return; }
  const btn = $('#g-sub'); if (btn) { btn.disabled = true; btn.textContent = 'Yoxlanılır…'; }
  try { await FBX.authM.signInWithEmailAndPassword(FBX.auth, email, pass); }
  catch (e) { S.gateMsg = emailAuthMsg(e); renderShell(); }
}
async function signIn(){
  const {authM, auth} = FBX;
  const prov = new authM.GoogleAuthProvider(); prov.setCustomParameters({prompt: 'select_account'});
  try { await authM.signInWithPopup(auth, prov); }
  catch (e) {
    const code = String(e && e.code || '');
    if (code.includes('popup-closed') || code.includes('cancelled-popup')) return;
    if (code.includes('popup-blocked') || code.includes('operation-not-supported')) {
      try { await authM.signInWithRedirect(auth, prov); return; } catch (e2) { e = e2; }
    }
    S.gateMsg = authMsg(e); renderShell();
  }
}

/* ================= boot ================= */
async function boot(){
  S.route = parseHash(); renderShell();
  getEmbedder().then(() => { S.ai = 'ready'; dataChanged(); backfill(); }, () => { S.ai = 'error'; dataChanged(); });
  if (DEMO) {
    await LocalStore.init(); Store = LocalStore; seedDemo();
    S.role = ['owner', 'editor', 'viewer'].includes(DEMO_ROLE) ? DEMO_ROLE : 'owner';
    startData(); return;
  }
  try { await loadFirebase(); }
  catch (e) { S.gate = 'error'; S.gateMsg = 'Proqram yüklənmədi. İnterneti yoxlayıb yenidən açın.'; renderShell(); return; }
  try { await FBX.authM.getRedirectResult(FBX.auth); } catch (e) { S.gateMsg = authMsg(e); }
  FBX.authM.onAuthStateChanged(FBX.auth, onUser);
}
function seedDemo(){
  if (LocalStore.list('categories').length) return;
  for (const c of DEFAULT_CATS) LocalStore.put('categories', c.id, c);
  for (const p of SEED_PRODUCTS) LocalStore.put('products', p.id, {...p, createdAt: 1, updatedAt: 1});
}
window.__ky = {S, get Store(){ return Store; }, rankQuery, sigFromImage, verdict};
boot();

</script>

if ('serviceWorker' in navigator && location.protocol === 'https:') {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
